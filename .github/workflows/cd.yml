# Every push to main redeploys the EC2 server.
# GitHub logs in to AWS with a short-lived OIDC token (no stored keys) and runs
# deploy/deploy.sh on the server through SSM (no SSH port open to the internet).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  INSTANCE_ID: i-0dcffd36c993d8739
  DEPLOY_ROLE: arn:aws:iam::695019458444:role/payagent-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on the server
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["cd /opt/payagent","git fetch --quiet origin main","git reset --hard --quiet origin/main","deploy/deploy.sh"]' \
            --query Command.CommandId --output text)

          while true; do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy status: $status"
          [ "$status" = Success ]
